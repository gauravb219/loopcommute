<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13202E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Loop Commute: plan multi-city trips worldwide with flights, transfers, hotels, food, visas and holidays.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Loop Commute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a dark departure-board band holds the route, the search and the multi-city stop builder; below it, a tabbed desk of panels. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#13202E; --muted:#5A6878; --line:#D8DEE5;
  --accent:#D9822B; --accent-ink:#9C540F; --accent-soft:#FBEBD8; --teal:#0E7C86; --teal-soft:#DDF0F1;
  --board:#13202E; --board-2:#1C2D40; --board-fg:#F3E6CC; --board-muted:#9DB0C4;
  --good:#1D8048; --warn:#B9740B; --bad:#BC3326; --good-soft:#DFF2E6; --warn-soft:#FAEED6; --bad-soft:#F8E0DD;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C131B; --surface:#141E29; --surface-2:#1A2633; --ink:#E6EBF0; --muted:#94A3B4; --line:#263445;
  --accent:#F0A04B; --accent-ink:#F4B067; --accent-soft:#3A2A17; --teal:#43BAC4; --teal-soft:#14343A;
  --board:#070C12; --board-2:#111C28; --board-fg:#F3E6CC; --board-muted:#8EA1B6;
  --good:#52C784; --warn:#E8B451; --bad:#F0705F; --good-soft:#163323; --warn-soft:#3A2E14; --bad-soft:#3E1D19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#141E29; --surface-2:#1A2633; --ink:#E6EBF0; --muted:#94A3B4; --line:#263445;
  --accent:#F0A04B; --accent-ink:#F4B067; --accent-soft:#3A2A17; --teal:#43BAC4; --teal-soft:#14343A;
  --board:#070C12; --board-2:#111C28; --board-fg:#F3E6CC; --board-muted:#8EA1B6;
  --good:#52C784; --warn:#E8B451; --bad:#F0705F; --good-soft:#163323; --warn-soft:#3A2E14; --bad-soft:#3E1D19;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--teal)}

/* board */
.board{background:var(--board);color:var(--board-fg)}
.board .wrap{padding-block:18px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.logo i{display:inline-block;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);position:relative}
.logo i::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--accent);transform:translateX(-50%) rotate(35deg)}
.asof{font-family:var(--f-mono);font-size:11.5px;color:var(--board-muted);letter-spacing:.04em}
.route{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:18px}
.flap{display:flex;gap:4px}
.flap span{font-family:var(--f-mono);font-weight:600;font-size:clamp(30px,7vw,52px);line-height:1;background:var(--board-2);padding:8px 6px;border-radius:5px;min-width:1.05em;text-align:center;position:relative;color:var(--board-fg)}
.flap span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--board)}
.route .arrow{font-size:30px;color:var(--accent);padding-bottom:10px}
.route .cities{font-size:14px;color:var(--board-muted);padding-bottom:6px;min-width:0}
.route .cities b{color:var(--board-fg);font-weight:600}
.search{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px;padding-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-muted);font-weight:600}
.field input,.field select{background:var(--board-2);border:1px solid #2B3E54;border-radius:8px;padding:9px 10px;color:var(--board-fg);width:100%;min-width:0;color-scheme:dark}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid #23344A}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:var(--board-muted);text-decoration:none;padding:12px 14px;font-weight:600;font-size:14px;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--board-fg)}
.tabs a[aria-current="page"]{color:var(--board-fg);border-bottom-color:var(--accent)}

main .wrap{padding-block:22px 60px}
.view{display:grid;gap:18px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-head h2{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{font-size:15px;font-weight:700;margin-bottom:10px}
.eyebrow{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.note{font-size:12.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1B1206}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* verdict */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.gauge{width:120px;height:120px;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .v b{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}
.gauge .v small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.verdict h3{font-family:var(--f-display);font-size:26px;text-transform:uppercase;letter-spacing:.01em;margin-bottom:6px}
.signals{display:grid;gap:8px;margin-top:14px}
.signal{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:start;font-size:14px;padding:8px 0;border-top:1px dashed var(--line)}
.signal .dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.signal small{display:block;color:var(--muted);font-size:12.5px}

/* cost */
.total{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 10px;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:grid;gap:6px}
.legend div{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font-size:14px}
.legend s{width:12px;height:12px;border-radius:3px;display:block;text-decoration:none}

/* tables / provider list */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.best td{background:var(--accent-soft)}
.prov{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.prov .mk{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600;color:#fff;flex:none}

/* boarding pass */
.pass{display:grid;grid-template-columns:1fr auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.pass .main{padding:16px 18px;display:grid;gap:10px;min-width:0}
.pass .stub{border-left:2px dashed var(--line);padding:16px 18px;display:grid;align-content:center;gap:4px;background:var(--surface-2);text-align:right;min-width:150px}
.pass .codes{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:26px;font-weight:600}
.pass .codes .ln{flex:1;height:1px;background:var(--line);position:relative;min-width:30px}
.pass .codes .ln::after{content:"✈";position:absolute;left:50%;top:-11px;font-size:14px;transform:translateX(-50%);color:var(--accent-ink);background:var(--surface);padding:0 4px}
.kv{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.kv div span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kv div b{font-weight:600}

/* date strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.day{flex:none;width:62px;border:1px solid var(--line);border-radius:8px;padding:8px 4px 6px;text-align:center;background:var(--surface);cursor:pointer;display:grid;gap:3px}
.day small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day b{font-size:15px}
.day .p{font-family:var(--f-mono);font-size:11px}
.day .bar{height:4px;border-radius:2px;background:var(--line)}
.day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.low .p{color:var(--good);font-weight:600}
.day.high .p{color:var(--bad)}
.day:hover{border-color:var(--muted)}

/* chart */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}

/* hotels tier picker */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tier{display:grid;gap:6px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left}
.tier[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tier .stars{color:var(--accent-ink);letter-spacing:2px;font-size:13px}
.tier b{font-size:22px;font-family:var(--f-display);font-weight:800}

/* itinerary */
.days{display:grid;gap:14px}
.dcard{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.dcard header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dcard header b{font-family:var(--f-display);font-size:20px;text-transform:uppercase;font-weight:800}
.dcard ol{list-style:none;margin:0;padding:6px 14px}
.dcard li{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.dcard li:last-child{border-bottom:0}
.dcard li .t{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dcard li .acts{display:flex;gap:2px}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:14px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.add-row{display:flex;gap:8px;padding:8px 14px 12px;flex-wrap:wrap}
.add-row input,.add-row select{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;min-width:0}
.add-row input{flex:1 1 160px}
.hol-flag{font-size:12px;color:var(--warn);font-weight:600}

/* visa */
.vfilters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.vfilters input,.vfilters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.vcard{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.vbig{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1}

/* holidays */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chip s{width:9px;height:9px;border-radius:50%;display:inline-block;text-decoration:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.cal .c{min-height:64px;border:1px solid var(--line);border-radius:7px;padding:4px 5px;background:var(--surface);font-size:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .c.out{visibility:hidden}
.cal .c.trip{background:var(--accent-soft);border-color:var(--accent)}
.cal .c.we .dn{color:var(--muted)}
.cal .c .dn{font-family:var(--f-mono);font-weight:600}
.cal .c .hs{display:flex;gap:3px;flex-wrap:wrap}
.cal .c .hs s{width:8px;height:8px;border-radius:50%;text-decoration:none}
.cal .c .hn{font-size:10.5px;line-height:1.2;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lw{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.lw .d{font-family:var(--f-mono);font-size:12.5px;text-align:center;border:1px solid var(--line);border-radius:7px;padding:4px 8px;min-width:64px}
.lw .d b{display:block;font-size:18px;font-family:var(--f-display)}

/* share */
.share-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
.share-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;background:var(--surface);cursor:pointer;font-size:14px}
.sbtn .mk{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-size:12px;font-weight:600;flex:none}
.sbtn:hover{border-color:var(--muted)}
textarea.share{width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.55;resize:vertical}
.story{max-width:270px;border-radius:14px;border:1px solid var(--line);display:block}
.ai-out{white-space:pre-wrap;font-size:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;max-height:420px;overflow:auto}
.ai-in{display:flex;gap:8px;flex-wrap:wrap}
.ai-in input{flex:1 1 220px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20}
.disclaimer{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:13px;color:var(--ink)}

/* loop logo */
.logo i{border-radius:50%;border:3px solid var(--accent);border-right-color:transparent;transform:rotate(-30deg)}
.logo i::after{content:"";position:absolute;right:-5px;top:1px;left:auto;bottom:auto;width:0;height:0;background:none;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--accent);transform:rotate(30deg)}
.route{margin-top:16px;gap:8px;align-items:center}
.route .flap span{font-size:clamp(22px,4.6vw,40px);padding:6px 5px}
.route .sep{color:var(--accent);font-size:22px;font-weight:700}
.route .loopback{font-family:var(--f-mono);font-size:12px;color:var(--board-muted);border:1px dashed #3A4F68;border-radius:6px;padding:4px 8px}
.board .cities{font-size:13.5px;color:var(--board-muted);margin-top:8px}
.board .cities b{color:var(--board-fg);font-weight:600}
.flabel{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--board-muted);font-weight:600}
.stops{border-top:1px solid #23344A;padding-block:12px 14px}
.stops-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.stop-row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.stopc{display:flex;align-items:center;gap:8px;background:var(--board-2);border:1px solid #2B3E54;border-radius:10px;padding:6px 8px 6px 10px;color:var(--board-fg);min-width:0}
.stopc .no{font-family:var(--f-mono);font-size:11px;color:var(--board);background:var(--accent);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-weight:600;flex:none}
.stopc .nm{font-weight:600;font-size:14px;line-height:1.2}
.stopc .nm small{display:block;font-weight:400;color:var(--board-muted);font-size:11.5px}
.stepper{display:inline-flex;align-items:center;border:1px solid #3A4F68;border-radius:7px;overflow:hidden}
.stepper button,.stopc .ib{background:transparent;border:0;color:var(--board-fg);cursor:pointer;padding:3px 8px;font-size:14px;line-height:1}
.stepper button:hover,.stopc .ib:hover{background:#2B3E54}
.stepper b{font-family:var(--f-mono);font-size:12.5px;padding:0 4px;min-width:30px;text-align:center}
.stopc .ib{color:var(--board-muted);border-radius:6px;padding:4px 6px}
.addstop{background:transparent;border:1px dashed #4A6078;border-radius:10px;color:var(--board-fg);padding:8px 10px;min-width:0;max-width:100%;color-scheme:dark}
.addstop option,.addstop optgroup{background:var(--board-2);color:var(--board-fg)}
/* timeline */
.tl{display:grid;gap:0;position:relative}
.tl-node{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.tl-rail{display:flex;flex-direction:column;align-items:center;align-self:stretch}
.tl-rail .b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:600;flex:none;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.tl-rail .b.city{background:var(--ink);border-color:var(--ink);color:var(--surface);font-size:11px}
.tl-rail .b.fl{border-color:var(--accent);color:var(--accent-ink)}
.tl-rail .b.gr{border-color:var(--teal);color:var(--teal)}
.tl-rail .ln{flex:1;width:2px;background:var(--line);min-height:14px}
.tl-body{padding-bottom:16px;min-width:0}
.seg{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.seg .md{font-weight:700}
.seg .meta{font-size:13px;color:var(--muted)}
.seg .pr{text-align:right;font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.seg .pr small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
.seg .lk{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.citycard{border:1px solid var(--ink);border-radius:10px;padding:12px 14px;background:var(--surface-2)}
.citycard h3{font-family:var(--f-display);font-size:24px;text-transform:uppercase;font-weight:800;margin:0}
.leg-title{font-family:var(--f-display);font-size:20px;text-transform:uppercase;font-weight:800;margin:6px 0 2px}
details.more summary{cursor:pointer;font-weight:600;color:var(--teal);font-size:13.5px;padding:6px 0}
.fcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.fcard .fh{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 16px;align-items:center}
.fcard .codes{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:22px;font-weight:600}
.fcard .codes .ln{flex:1;height:1px;background:var(--line);min-width:30px;max-width:120px;position:relative}
.fcard .fb{border-top:1px solid var(--line);padding:4px 16px 12px}
.tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tag.intl{color:var(--accent-ink);border-color:var(--accent)}
.stop-sec{display:grid;gap:12px}
.stop-sec>*{min-width:0}
.tl-node>*{min-width:0}
.stop-sec>header{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap}
.stop-sec h3{font-family:var(--f-display);font-size:24px;text-transform:uppercase;font-weight:800;margin:0}

@media (max-width:560px){
  .seg{grid-template-columns:1fr}
  .seg .pr{text-align:left}

  .verdict{grid-template-columns:1fr}
  .pass{grid-template-columns:1fr}
  .pass .stub{border-left:0;border-top:2px dashed var(--line);text-align:left}
  .cal .c{min-height:46px}
  .cal .c .hn{display:none}
  .dcard li{grid-template-columns:62px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  const k=XFER[A.id+"-"+B.id]||XFER[B.id+"-"+A.id];
  if(k){const air=/^Flight/.test(k[0])&&!/\+/.test(k[0])&&A.iata&&B.iata;return[{type:"ground",a:A,b:B,date,mode:k[0],hours:k[1],usd:k[2],note:k[3],air}]}
  const segs=[];
  if(A.cc===B.cc){const pa=apt(A),pb=apt(B),d=km(A,B),rail=RAIL[A.cc];
    if(pa.id===pb.id||d<=300){if(rail&&d>60)return[{type:"ground",a:A,b:B,date,mode:"Train",hours:d/(A.cc==="IN"?55:130)+.3,usd:Math.max(6,rail*d),note:""}];
      return[{type:"ground",a:A,b:B,date,mode:d<90?"Taxi or private car":"Private car or bus",hours:d/55+.3,usd:d<90?12:Math.round(.05*d+8),note:""}]}
    if(rail&&d<=650&&A.cc!=="IN")return[{type:"ground",a:A,b:B,date,mode:"Train",hours:d/190+.5,usd:rail*d,note:""}];
    if(A.via)segs.push(groundToAirport(A,date,false));segs.push(flightSeg(pa,pb,date));if(B.via)segs.push(groundToAirport(B,date,true));return segs}
  const pa=apt(A),pb=apt(B),ga=gateway(pa),gb=gateway(pb);
  if(A.via)segs.push(groundToAirport(A,date,false));
  if(ga.id!==pa.id)segs.push(flightSeg(pa,ga,date));
  segs.push(flightSeg(ga,gb,date));
  if(gb.id!==pb.id)segs.push(flightSeg(gb,pb,date));
  if(B.via)segs.push(groundToAirport(B,date,true));
  return segs}
function journey(depStr=S.dep){const dep=parse(depStr);let cur=dep;const stops=S.stops.map(s=>{const c=CITY[s.id];const st={...s,c,in:cur,out:addD(cur,s.n)};cur=st.out;return st});
  const ret=cur;const legs=[];const O=ORIGIN();
  legs.push({kind:"out",from:O,to:stops[0].c,date:dep,segs:planTravel(O,stops[0].c,dep)});
  for(let i=0;i<stops.length-1;i++)legs.push({kind:"xfer",from:stops[i].c,to:stops[i+1].c,date:stops[i].out,segs:planTravel(stops[i].c,stops[i+1].c,stops[i].out)});
  if(S.trip==="round")legs.push({kind:"ret",from:stops[stops.length-1].c,to:O,date:ret,segs:planTravel(stops[stops.length-1].c,O,ret)});
  return{dep,ret,stops,legs,nights:diffD(dep,ret)}}
const allSegs = J=>J.legs.flatMap(l=>l.segs.map(s=>({...s,leg:l})));

/* ---------------- Price models ---------------- */
function season(city,month){const m=month+1;if(city.peak.includes(m))return{k:"peak",f:1.24,label:"Peak season"};if(city.shoulder.includes(m))return{k:"shoulder",f:1.06,label:"Shoulder season"};return{k:"off",f:.9,label:"Off-season"}}
function holidaysNear(cc,d,before,after){const L=HOL[cc]||[];const a=iso(addD(d,-before)),b=iso(addD(d,after));return L.filter(h=>h[0]>=a&&h[0]<=b)}
function leadF(days,dom){if(days<3)return 1.7;if(days<7)return 1.48;if(days<14)return 1.27;if(days<21)return 1.13;
  const lo=dom?[21,50]:[35,85];if(days<=lo[1]&&days>=lo[0])return .93;if(days<lo[0])return 1.13-(days-21)/(lo[0]-21||1)*.2;if(days<=150)return .93+(days-lo[1])/(150-lo[1])*.08;return 1.02}
function oneWayBase(o,d){const k=km(o,d);if(o.cc===d.cc){if(o.cc==="IN")return 1700+4.3*k;return(38+.095*k)*FX.USD*(DOM_PRICE[o.cc]||1)}return(55+.074*k+(k>6500?90:0)+(k>10000?120:0))*FX.USD}
function fare(o,d,date,bookOn=TODAY){const base=oneWayBase(o,d);const s=season(d,date.getMonth()).f;const dow=[1.04,.97,.94,.95,1.03,1.08,1.0][date.getDay()];
  const hol=(holidaysNear(o.cc,date,2,3).length?1.1:1)*(holidaysNear(d.cc,date,1,2).length?1.05:1);const lead=leadF(Math.max(0,diffD(bookOn,date)),o.cc===d.cc);const n=.94+hash(o.id+d.id+iso(date))*.12;return base*s*dow*hol*lead*n}
function segQuotes(seg,bookOn=TODAY){const base=fare(seg.a,seg.b,seg.date,bookOn);return FLIGHT_PROV.map(p=>{const per=base*p.f*(.985+hash(p.id+seg.a.id+seg.b.id+iso(seg.date))*.03)+p.fee;return{...p,per,total:per*S.adults}}).sort((x,y)=>x.total-y.total)}
const segBest = (seg,bookOn)=>segQuotes(seg,bookOn)[0];
const groundCost = seg=>seg.usd*FX.USD*S.adults;
function flightsTotal(J,bookOn=TODAY){return allSegs(J).filter(s=>s.type==="flight").reduce((a,s)=>a+segBest(s,bookOn).total,0)}
function hotelNight(tierM,city,inD,n){let tot=0;for(let i=0;i<n;i++){const d=addD(inD,i);const s=season(city,d.getMonth()).f;const we=(d.getDay()===5||d.getDay()===6)?1.08:1;const hol=holidaysNear(city.cc,d,0,0).length?1.12:1;tot+=city.hotel*FX.USD*tierM*s*we*hol*(.95+hash(city.id+iso(d))*.1)}return tot/n}
function hotelQuotes(st,tierK=st.tier){const T=TIERS.find(t=>t.k===tierK);const n=hotelNight(T.m,st.c,st.in,st.n);return HOTEL_PROV.map(p=>{const night=n*p.f*(.98+hash(p.id+st.c.id+iso(st.in)+tierK)*.05);return{...p,night,total:night*st.n*S.rooms}}).sort((a,b)=>a.total-b.total)}
const hotelBest = st=>hotelQuotes(st).find(h=>h.id!=="abb");
const foodInfo = cc=>FOOD[cc]||["Local specialities","Check menus locally.","Varies by city.",[5,12,40]];
const foodDay = cc=>{const st=FOOD_STYLES.find(f=>f.k===S.food)||FOOD_STYLES[1];return st.f(foodInfo(cc)[3])*FX.USD};
function destCountries(J){return[...new Set(J.stops.map(s=>s.c.cc))].filter(c=>c!==ORIGIN().cc)}
function visaOf(cc){return VISA[cc]||["Check requirements",0,10,"—","No entry in our table for this country yet.",""]}
function costs(J=journey()){const segs=allSegs(J);const fl=segs.filter(s=>s.type==="flight").reduce((a,s)=>a+segBest(s).total,0);const gr=segs.filter(s=>s.type==="ground").reduce((a,s)=>a+groundCost(s),0);
  const hotel=J.stops.reduce((a,st)=>a+hotelBest(st).total,0);
  const days=J.stops.map((st,i)=>st.n+(i===J.stops.length-1?1:0));
  const food=J.stops.reduce((a,st,i)=>a+foodDay(st.c.cc)*days[i]*S.adults,0);
  const sights=J.stops.reduce((a,st,i)=>a+st.c.daily*FX.USD*days[i]*S.adults,0);
  const visa=destCountries(J).reduce((a,c)=>a+visaOf(c)[1]*S.adults,0);
  const abroad=destCountries(J).length>0;const ins=abroad?180*(J.nights+1)*S.adults:0;
  const items=[{k:"Flights",v:fl,c:"var(--accent)"},{k:"Transfers between cities",v:gr,c:"#B9740B"},{k:"Hotels",v:hotel,c:"var(--teal)"},{k:"Food & drink",v:food,c:"#C0392B"},{k:"Sights & local transport",v:sights,c:"#2E86C1"},{k:"Visa",v:visa,c:"#7B5EA7"},{k:"Travel insurance",v:ins,c:"#8C9AAB"}];
  return{items,total:items.reduce((a,b)=>a+b.v,0)}}
function bookingCurve(J){const out=[];const first=J.dep;for(let k=0;k<=12;k++){const b=addD(TODAY,k*7);if(diffD(b,first)<1)break;out.push({k,date:b,p:flightsTotal(J,b)})}return out}
function mainPair(J){const segs=allSegs(J).filter(s=>s.type==="flight"&&s.leg.kind==="out");const m=segs.sort((a,b)=>km(b.a,b.b)-km(a.a,a.b))[0];return m?[m.a,m.b]:null}
function verdict(J){const daysOut=diffD(TODAY,J.dep);const curve=bookingCurve(J);const sig=[];let score=70;let now=0,min=0,minAt={k:0,date:TODAY};
  if(curve.length&&curve[0].p>0){now=curve[0].p;min=Math.min(...curve.map(c=>c.p));minAt=curve.find(c=>c.p===min);
    if(now<=min*1.03){sig.push({s:"good",t:"Fare timing: book flights now",d:`Today's estimate is within 3% of the lowest expected before departure (${daysOut} days out).`});score+=12}
    else{sig.push({s:"warn",t:`Fare timing: wait about ${minAt.k} week${minAt.k>1?"s":""}`,d:`Flights are expected to drop about ${Math.round((now/min-1)*100)}% around ${fmtD(minAt.date)}. Set price alerts.`});score-=6}
    const last=curve[curve.length-1];if(curve.length>3&&last.p>now*1.15){sig.push({s:"bad",t:"Prices climb sharply closer to the date",d:"Last-minute fares on these routes rise more than 15%."});score-=4}}
  const main=J.stops.slice().sort((a,b)=>b.n-a.n)[0];const se=season(main.c,main.in.getMonth());
  sig.push({s:se.k==="peak"?"warn":"good",t:`${se.label} in ${sname(main.c)}`,d:se.k==="peak"?"Best weather and the biggest crowds; hotels run about 25% above average.":se.k==="shoulder"?"Decent weather, fewer crowds, fairer prices.":"Lower prices; check the weather (monsoon, heat or cold) first."});score+=se.k==="peak"?-5:4;
  const dh=J.stops.flatMap(st=>holidaysNear(st.c.cc,st.in,0,st.n).map(h=>({h,st})));const seen=new Set();const dhu=dh.filter(x=>{const k=x.h[0]+x.h[1];if(seen.has(k))return false;seen.add(k);return true});
  if(dhu.length){sig.push({s:"warn",t:`${dhu.length} public holiday${dhu.length>1?"s":""} during your stay`,d:dhu.slice(0,3).map(x=>`${x.h[1]} in ${ccName(x.st.c.cc)} (${fmtD(parse(x.h[0]))})`).join(", ")+". Expect busier sights and some closures."});score-=4}
  const oh=holidaysNear(ORIGIN().cc,J.dep,3,3);if(oh.length){sig.push({s:"warn",t:"Departure sits next to a home holiday",d:oh.map(h=>`${h[1]} (${fmtD(parse(h[0]))})`).join(", ")+". Outbound demand is higher."});score-=4}
  const xf=J.legs.filter(l=>l.kind==="xfer");const longX=xf.filter(l=>l.segs.reduce((a,s)=>a+s.hours,0)>6);if(longX.length){sig.push({s:"warn",t:`${longX.length} long transfer day${longX.length>1?"s":""}`,d:longX.map(l=>`${sname(l.from)} → ${sname(l.to)}`).join(", ")+" takes more than 6 hours. Keep that day light."});score-=3}
  const short=J.stops.filter(s=>s.n<2&&J.stops.length>1);if(short.length){sig.push({s:"warn",t:"Very short stop",d:short.map(s=>sname(s.c)).join(", ")+" has only one night. Consider adding a night."});score-=2}
  destCountries(J).forEach(cc=>{const v=visaOf(cc);if(v[2]>0){const slack=daysOut-v[2];if(slack<7){sig.push({s:"bad",t:`Visa risk for ${ccName(cc)}: ${v[0]} takes about ${v[2]} days`,d:`You leave in ${daysOut} days. Apply today or move your dates.`});score-=18}else if(slack<21){sig.push({s:"warn",t:`${ccName(cc)} visa: apply within ${slack-7} days`,d:`${v[0]} takes about ${v[2]} days.`});score-=4}else sig.push({s:"good",t:`${ccName(cc)}: ${v[0]}, plenty of time`,d:`About ${v[2]} days to process; you leave in ${daysOut}.`})}else sig.push({s:"good",t:`${ccName(cc)}: ${v[0]}`,d:v[4]||"Nothing to apply for in advance."})});
  score=Math.max(5,Math.min(98,Math.round(score)));const head=score>=78?"Good time to book":score>=60?"Book soon, watch prices":score>=45?"Proceed with care":"Rethink the dates";
  return{score,head,sig,now,min,minAt}}

/* ---------------- Links ---------------- */
function dmy(d){return`${d2(d.getDate())}/${d2(d.getMonth()+1)}/${d.getFullYear()}`}
function flightLinkOW(id,o,d,date){const n=S.adults,ds=iso(date),intl=o.cc!=="IN"||d.cc!=="IN";
  switch(id){
  case"sky":return`https://www.skyscanner.co.in/transport/flights/${o.toLowerCase?o.toLowerCase():o}/${d.toLowerCase()}/${ds.slice(2).replace(/-/g,"")}/?adultsv2=${n}&cabinclass=economy`;
  case"gfl":return`https://www.google.com/travel/flights?q=${encodeURIComponent(`One way flights from ${o} to ${d} on ${ds} for ${n} adults`)}`;
  case"mmt":return`https://www.makemytrip.com/flight/search?itinerary=${o}-${d}-${dmy(date)}&tripType=O&paxType=A-${n}_C-0_I-0&intl=${intl}&cabinClass=E`;
  case"gib":return`https://www.goibibo.com/flights/air-${o}-${d}-${ds.replace(/-/g,"")}--${n}-0-0-E-${intl?"I":"D"}/`;
  case"ctp":return`https://www.cleartrip.com/flights/results?adults=${n}&childs=0&infants=0&class=Economy&depart_date=${dmy(date)}&from=${o}&to=${d}&intl=${intl?"y":"n"}`;
  case"ixi":return`https://www.ixigo.com/search/result/flight?from=${o}&to=${d}&date=${dmy(date).replace(/\//g,"")}&adults=${n}&children=0&infants=0&class=e`;
  case"emt":return"https://www.easemytrip.com/flights.html";
  case"ago":return"https://www.agoda.com/flights";}}
const fLink=(id,seg)=>flightLinkOW(id,seg.a.iata,seg.b.iata,seg.date);
const PREFILL_F=new Set(["sky","gfl","mmt","gib","ctp","ixi"]),PREFILL_H=new Set(["ago","bkg","mmt","ctp","abb"]);
function multiCityLinks(J){const f=allSegs(J).filter(s=>s.type==="flight");if(f.length<2)return null;const n=S.adults;const intl=f.some(s=>s.a.cc!=="IN"||s.b.cc!=="IN");
  const mmt=`https://www.makemytrip.com/flight/search?itinerary=${f.map(s=>`${s.a.iata}-${s.b.iata}-${dmy(s.date)}`).join("_")}&tripType=M&paxType=A-${n}_C-0_I-0&intl=${intl}&cabinClass=E`;
  const g=`https://www.google.com/travel/flights?q=${encodeURIComponent("Multi-city flights "+f.map(s=>`${s.a.iata} to ${s.b.iata} on ${iso(s.date)}`).join(", ")+` for ${n} adults`)}`;return{mmt,g,f}}
function hotelLink(id,st){const c=sname(st.c),a=st.in,b=st.out,ad=Math.max(1,Math.round(S.adults/S.rooms));const mdy=d=>`${d2(d.getMonth()+1)}${d2(d.getDate())}${d.getFullYear()}`;const q=encodeURIComponent(c);
  switch(id){
  case"ago":return`https://www.agoda.com/search?textToSearch=${q}&checkIn=${iso(a)}&checkOut=${iso(b)}&rooms=${S.rooms}&adults=${S.adults}`;
  case"bkg":return`https://www.booking.com/searchresults.html?ss=${q}&checkin=${iso(a)}&checkout=${iso(b)}&group_adults=${S.adults}&no_rooms=${S.rooms}`;
  case"mmt":return`https://www.makemytrip.com/hotels/hotel-listing/?checkin=${mdy(a)}&checkout=${mdy(b)}&searchText=${q}&roomStayQualifier=${ad}e0e`;
  case"gib":return"https://www.goibibo.com/hotels/";
  case"ctp":return`https://www.cleartrip.com/hotels/results?city=${q}&chk_in=${dmy(a)}&chk_out=${dmy(b)}&adults1=${ad}&num_rooms=${S.rooms}`;
  case"ghl":return`https://www.google.com/travel/hotels?q=${encodeURIComponent("hotels in "+c)}`;
  case"abb":return`https://www.airbnb.co.in/s/${q}/homes?checkin=${iso(a)}&checkout=${iso(b)}&adults=${S.adults}`;}}
const slug=s=>encodeURIComponent(s.replace(/[^\p{L}\p{N} -]/gu,"").trim().replace(/ +/g,"-"));
function groundLinks(seg){const L=[[`Compare routes on Rome2rio`,`https://www.rome2rio.com/map/${slug(sname(seg.a))}/${slug(sname(seg.b))}`]];const cc=seg.a.cc;
  if(["TH","VN","ID","MY","PH","KH"].includes(cc))L.push(["12Go (bus, ferry, train)","https://12go.asia/en"]);
  if(cc==="IN")L.push(["IRCTC trains","https://www.irctc.co.in"],["redBus","https://www.redbus.in"]);

function cityOptions(selected,exclude=new Set(),prefCC=null){const groups={};CITIES.forEach(c=>{if(exclude.has(c.id))return;(groups[c.cc]=groups[c.cc]||[]).push(c)});
  const keys=Object.keys(groups).sort((a,b)=>(a===prefCC?-1:b===prefCC?1:ccName(a).localeCompare(ccName(b))));
  return keys.map(k=>`<optgroup label="${esc(ccName(k))}">${groups[k].map(c=>`<option value="${c.id}" ${c.id===selected?"selected":""}>${esc(c.city)}${c.iata?` (${c.iata})`:""}</option>`).join("")}</optgroup>`).join("")}

    if(id==="cc"){S.cc=$("#cc").value;S.stops=defStops(S.cc)}

    if($("#dep").value)S.dep=$("#dep").value;if(parse(S.dep)<=TODAY)S.dep=iso(addD(TODAY,1));
    syncForm();save();render()});
  $("#search").addEventListener("submit",e=>e.preventDefault());
  $("#stopRow").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const i=+b.dataset.i,a=b.dataset.act,L=S.stops;

    else if(a==="up"&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];else if(a==="down"&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
    else if(a==="del"){if(L.length===1){toast("Keep at least one city");return}L.splice(i,1)}

  syncForm()}
function syncForm(){const J=journey();$("#from").value=S.from;$("#cc").value=S.cc;$("#trip").value=S.trip;$("#dep").value=S.dep;$("#adults").value=S.adults;$("#rooms").value=S.rooms;$("#cur").value=S.cur;

const VIEWS={decide:vDecide,route:vRoute,flights:vFlights,hotels:vHotels,food:vFood,trends:vTrends,plan:vPlan,visa:vVisa,holidays:vHolidays,share:vShare};

const after={};
function render(){const r=route();document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+r?"page":"false"));const J=journey();$("#view").innerHTML=VIEWS[r](J);after[r]&&after[r](J)}
const disclaimer=`<div class="disclaimer">Prices are estimates from a fare and rate model (distance, season, public holidays, day of week and booking window), refreshed for today's date. They are not live quotes. Each provider button opens that site's live results for your search.</div>`;
function gauge(score){const r=52,c=2*Math.PI*r,col=score>=78?"var(--good)":score>=60?"var(--accent)":score>=45?"var(--warn)":"var(--bad)";return`<div class="gauge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}"/></svg><div class="v"><div><b>${score}</b><small>Trip score</small></div></div></div>`}
function dateStrip(J){const days=[];for(let i=-7;i<=7;i++){const x=addD(J.dep,i);if(x<=TODAY)continue;const j=journey(iso(x));days.push({x,p:flightsTotal(j)})}
  const ps=days.map(d=>d.p),mn=Math.min(...ps),mx=Math.max(...ps);
  return`<div class="strip" id="strip">${days.map(dd=>{const t=(dd.p-mn)/((mx-mn)||1);const lv=t<.2?"low":t>.8?"high":"";return`<button class="day ${iso(dd.x)===S.dep?"sel":""} ${lv}" data-d="${iso(dd.x)}" aria-label="Depart ${fmtD(dd.x)}, flights ${money(dd.p)}"><small>${DOW[dd.x.getDay()]}</small><b>${dd.x.getDate()} ${MON[dd.x.getMonth()]}</b><span class="p">${shortMoney(dd.p)}</span><span class="bar" style="background:linear-gradient(90deg,${t<.2?"var(--good)":t>.8?"var(--bad)":"var(--accent)"} ${Math.round(20+t*80)}%,var(--line) 0)"></span></button>`}).join("")}</div><p class="note">All flights on this route for ${S.adults}, keeping your nights in each city. Tap a day to move the whole trip.</p>`}
function bindStrip(){const s=$("#strip");if(!s)return;s.addEventListener("click",e=>{const b=e.target.closest(".day");if(!b)return;S.dep=b.dataset.d;syncForm();save();render()});const sel=s.querySelector(".sel");if(sel)s.scrollLeft=sel.offsetLeft-s.clientWidth/2+31}

function vDecide(J){const v=verdict(J);const c=costs(J);const fl=c.items[0].v;
  return`<div class="sec-head"><div><h2>Should you book this trip?</h2><p>${J.stops.length} cit${J.stops.length>1?"ies":"y"} in ${[...new Set(J.stops.map(s=>ccName(s.c.cc)))].join(" & ")}, ${J.nights} nights. One read of fares, season, holidays, transfers and visa timing.</p></div></div>
  <div class="grid2">
    <section class="panel"><div class="verdict">${gauge(v.score)}<div><div class="eyebrow">Verdict</div><h3>${v.head}</h3><p class="note" style="margin:0">All flights today: <b class="num">${money(fl)}</b> for ${S.adults}.${v.min?` Lowest expected: <b class="num">${money(v.min)}</b>${v.minAt.k?` around ${fmtD(v.minAt.date)}`:" (now)"}.`:""}</p></div></div>
      <div class="signals">${v.sig.map(s=>`<div class="signal"><span class="dot ${s.s}"></span><div><b>${esc(s.t)}</b><small>${esc(s.d)}</small></div></div>`).join("")}</div></section>

      <div class="legend">${c.items.map(i=>`<div><s style="background:${i.c}"></s><span>${i.k}</span><b class="num">${money(i.v)}</b></div>`).join("")}</div>

  <section class="panel" id="aiBox" hidden><h3>Ask the trip advisor</h3><p class="note" style="margin-top:0">Answers use this trip's route and numbers. Try "Is 2 nights enough in Krabi?" or "Best order for these cities?".</p>
    <form class="ai-in" id="aiForm"><input id="aiQ" placeholder="Ask about this trip" aria-label="Question for the trip advisor"><button class="btn primary" type="submit">Ask</button></form><div class="ai-out" id="aiOut" hidden></div></section>
  ${disclaimer}`}
function segLabel(s){return s.type==="flight"?`Flight ${s.a.iata}→${s.b.iata}`:s.mode}
function miniRoute(J){return`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>From → To</th><th>How</th><th class="r">Time</th><th class="r">Cost for ${S.adults}</th></tr></thead><tbody>${J.legs.map(l=>{const t=l.segs.reduce((a,s)=>a+s.hours,0);const p=l.segs.reduce((a,s)=>a+(s.type==="flight"?segBest(s).total:groundCost(s)),0);
  return`<tr><td class="mono">${fmtD(l.date)}</td><td><b>${esc(sname(l.from))} → ${esc(sname(l.to))}</b>${l.kind!=="xfer"?` <span class="tag ${l.segs.some(s=>s.intl)?"intl":""}">${l.kind==="out"?"Outbound":"Return"}</span>`:""}</td><td>${l.segs.map(segLabel).map(esc).join(" + ")}</td><td class="r mono">${fmtHrs(t)}</td><td class="r mono"><b>${money(p)}</b></td></tr>`}).join("")}</tbody></table></div>`}
after.decide=J=>{bindStrip();initAI()};
let SAMPLE=null,sampleTried=false;
async function initAI(){if(!$("#aiBox"))return;if(!sampleTried){sampleTried=true;try{SAMPLE=window.claude?await window.claude.use("sample"):null}catch(e){SAMPLE=null}}if(!SAMPLE||!$("#aiBox"))return;$("#aiBox").hidden=false;
  $("#aiForm").addEventListener("submit",async e=>{e.preventDefault();const q=$("#aiQ").value.trim();if(!q)return;const out=$("#aiOut");out.hidden=false;out.textContent="Thinking…";
    try{await SAMPLE(`You are a concise, practical travel advisor. Use the trip summary below (prices are model estimates, not live quotes). Answer in under 220 words with short bullet points where helpful, and say when something must be checked on an official site.\n\nTRIP SUMMARY\n${shareText()}\n\nQUESTION: ${q}`,{onText:({text})=>{out.textContent=text},modelTier:"default",cache:false})}catch(err){out.textContent=err&&err.code==="rate_limited"?"Too many questions in a short time. Try again in a minute.":err&&err.code==="not_granted"?"The advisor needs your permission to answer. Allow it from this page's permissions menu.":"The advisor could not answer right now."}})}

const modeTag=s=>s.type==="flight"?"FLT":/train|shinkansen|ktx|tgv/i.test(s.mode)?"RAIL":/ferry|boat|cruise|seaplane/i.test(s.mode)?"SEA":/flight/i.test(s.mode)?"FLT":"ROAD";
function segBlock(s){if(s.type==="flight"){const q=segBest(s);return`<div class="seg"><div><div class="md">Flight ${s.a.iata} → ${s.b.iata} <span class="tag ${s.intl?"intl":""}">${s.intl?"International":"Domestic"}</span></div><div class="meta">${esc(s.a.city)} to ${esc(s.b.city)} · ${DOW[s.date.getDay()]} ${fmtD(s.date)} · ~${fmtHrs(s.hours)} nonstop · ${Math.round(km(s.a,s.b)).toLocaleString()} km</div></div>
  <div class="pr">${money(q.total)}<small>best est. on ${q.name}</small></div><div class="lk"><a class="btn small primary" href="${fLink(q.id,s)}" target="_blank" rel="noopener">Book on ${q.name} ↗</a><a class="btn small" href="#flights">Compare 8 sites</a></div></div>`}
  return`<div class="seg"><div><div class="md">${esc(s.mode)}</div><div class="meta">${esc(sname(s.a))} to ${esc(sname(s.b))} · ${fmtD(s.date)} · about ${fmtHrs(s.hours)}${s.note?` · ${esc(s.note)}`:""}</div></div><div class="pr">${s.usd?money(groundCost(s)):"Included"}<small>${s.usd?`about ${money(s.usd*FX.USD)} per person`:""}</small></div>
  <div class="lk">${groundLinks(s).map(([t,u],i)=>`<a class="btn small ${i===0?"primary":""}" href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a>`).join("")}</div></div>`}
function vRoute(J){const O=ORIGIN();let h="";
  const node=(badge,cls,body,last)=>`<div class="tl-node"><div class="tl-rail"><span class="b ${cls}">${badge}</span>${last?"":`<span class="ln"></span>`}</div><div class="tl-body">${body}</div></div>`;
  h+=node(O.id,"city",`<div class="citycard"><span class="eyebrow">Start</span><h3>${esc(O.city)}</h3><span class="note">${ccName(O.cc)} · leave ${DOW[J.dep.getDay()]} ${fmtDY(J.dep)}</span></div>`);
  J.legs.forEach((l,li)=>{const t=l.segs.reduce((a,s)=>a+s.hours,0);
    h+=node("","", `<div class="leg-title">${l.kind==="out"?"Getting there":l.kind==="ret"?"Heading home":"Transfer"} · ${esc(sname(l.from))} → ${esc(sname(l.to))}</div><p class="note" style="margin:0 0 8px">${l.segs.length>1?`${l.segs.length} legs, `:""}about ${fmtHrs(t+(l.segs.length>1?(l.segs.length-1)*1.5:0))} door to door${l.segs.length>1?" including changeover time":""}.</p>`);
    l.segs.forEach(s=>{h+=node(modeTag(s),s.type==="flight"||/^Flight/.test(s.mode)?"fl":"gr",segBlock(s))});
    if(l.kind!=="ret"){const st=J.stops.find(x=>x.c.id===l.to.id&&diffD(x.in,l.date)===0)||J.stops[li];const hb=hotelBest(st);
      h+=node(st.c.id,"city",`<div class="citycard"><span class="eyebrow">Stop ${J.stops.indexOf(st)+1} · ${ccName(st.c.cc)}</span><h3>${esc(sname(st.c))}</h3><div class="kv" style="margin-top:6px"><div><span>Stay</span><b>${fmtD(st.in)} – ${fmtD(st.out)} · ${st.n}n</b></div><div><span>Hotel (${TIERS.find(t=>t.k===st.tier).n})</span><b class="num">${money(hb.night)}/night</b></div><div><span>Food per day</span><b class="num">${money(foodDay(st.c.cc))} pp</b></div><div><span>Stay in</span><b>${esc(st.c.areas.slice(0,2).join(", "))}</b></div></div></div>`,li===J.legs.length-1)}});
  if(S.trip==="round")h+=node(O.id,"city",`<div class="citycard"><span class="eyebrow">Home</span><h3>${esc(O.city)}</h3><span class="note">Back ${DOW[J.ret.getDay()]} ${fmtDY(J.ret)}</span></div>`,true);
  return`<div class="sec-head"><div><h2>Route &amp; transfers</h2><p>Every flight, connection, ferry, train and car between your cities. Cities without their own airport are reached through the nearest one, and small airports connect through the country's main gateway.</p></div></div>
  <section class="panel"><div class="tl">${h}</div></section>${disclaimer}`}

function provRow(p,href,prefill,cells,best){return`<tr class="${best?"best":""}"><td><div class="prov"><span class="mk" style="background:${p.col}">${p.mk}</span><div>${p.name}${best?' <span class="pill acc">Lowest</span>':""}<div class="note" style="font-weight:400">${p.kind}</div></div></div></td>${cells}<td class="r"><a class="btn small ${best?"primary":""}" href="${href}" target="_blank" rel="noopener">${prefill?"See live fares":"Open site"} ↗</a></td></tr>`}
function vFlights(J){const segs=allSegs(J).filter(s=>s.type==="flight");const total=flightsTotal(J);const mc=multiCityLinks(J);
  const O=ORIGIN(),first=J.stops[0].c,last=J.stops[J.stops.length-1].c;
  let compare="";if(S.trip==="round"&&first.id!==last.id){const alt=journeyAlt(J);compare=`<section class="panel"><h3>Open-jaw vs a plain return</h3><div class="grid3">
    <div><div class="eyebrow">Your route</div><b class="total num" style="font-size:30px">${money(total)}</b><div class="note">Into ${esc(sname(first))}, home from ${esc(sname(last))}. No backtracking.</div></div>
    <div><div class="eyebrow">Plain return to ${esc(sname(first))}</div><b class="total num" style="font-size:30px">${money(alt.total)}</b><div class="note">Flights only. Add about ${money(alt.extra)} and ${fmtHrs(alt.hours)} to get back to ${esc(sname(first))}.</div></div>
    <div><div class="eyebrow">Verdict</div><b style="font-size:17px">${total<=alt.total+alt.extra?"Open-jaw wins":"Plain return is cheaper"}</b><div class="note">${total<=alt.total+alt.extra?`Saves about ${money(alt.total+alt.extra-total)} and a travel day.`:`Saves about ${money(total-alt.total-alt.extra)}, but costs you a travel day.`}</div></div></div></section>`}
  return`<div class="sec-head"><div><h2>Flights</h2><p>${segs.length} flight${segs.length>1?"s":""} on this ${S.trip==="round"?"open-jaw round trip":"one-way trip"}. Each is priced one way, so you can book them separately or together as a multi-city ticket.</p></div><div role="group" aria-label="Trip type" style="display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden">${[["round","Round trip"],["oneway","One way"]].map(([k,n])=>`<button class="tt" data-t="${k}" aria-pressed="${S.trip===k}" style="border:0;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px;background:${S.trip===k?"var(--ink)":"var(--surface)"};color:${S.trip===k?"var(--surface)":"var(--muted)"}">${n}</button>`).join("")}</div></div>
  <div class="pass"><div class="main"><div class="codes"><span>${O.iata||apt(O).iata}</span><span class="ln"></span><span>${S.trip==="round"?(O.iata||apt(O).iata):(last.iata||apt(last).iata)}</span></div><div class="kv"><div><span>Flights</span><b>${segs.length}</b></div><div><span>Depart</span><b>${fmtDY(J.dep)}</b></div><div><span>${S.trip==="round"?"Return":"Last flight"}</span><b>${fmtDY(S.trip==="round"?J.ret:segs[segs.length-1]?.date||J.dep)}</b></div><div><span>Type</span><b>${S.trip==="round"?"Open-jaw round trip":"One way"}</b></div></div></div>
    <div class="stub"><span class="eyebrow">All flights</span><b class="total num" style="font-size:34px">${money(total)}</b><span class="note">${S.adults} traveller${S.adults>1?"s":""}, best site per flight</span></div></div>
  ${mc?`<section class="panel"><h3>Book as one multi-city ticket</h3><p class="note" style="margin-top:0">One ticket protects your connections if a flight is delayed. Compare it against booking each flight separately below.</p><div class="links"><a class="btn primary" href="${mc.mmt}" target="_blank" rel="noopener">MakeMyTrip multi-city ↗</a><a class="btn" href="${mc.g}" target="_blank" rel="noopener">Google Flights multi-city ↗</a><a class="btn" href="https://www.skyscanner.co.in/flights" target="_blank" rel="noopener">Skyscanner multi-city ↗</a></div></section>`:""}
  ${compare}
  ${segs.map((s,i)=>{const q=segQuotes(s);return`<article class="fcard"><div class="fh"><div><div class="row" style="gap:8px"><span class="tag ${s.intl?"intl":""}">${s.intl?"International":"Domestic"}</span><span class="tag">${s.leg.kind==="out"?"Outbound":s.leg.kind==="ret"?"Return":"Between cities"}</span></div>
    <div class="codes" style="margin-top:8px"><span>${s.a.iata}</span><span class="ln"></span><span>${s.b.iata}</span></div><div class="note">${esc(s.a.city)} → ${esc(s.b.city)} · ${DOW[s.date.getDay()]} ${fmtDY(s.date)} · ~${fmtHrs(s.hours)} · ${Math.round(km(s.a,s.b)).toLocaleString()} km</div></div>
    <div style="text-align:right"><b class="total num" style="font-size:28px">${money(q[0].total)}</b><div class="note">${money(q[0].per)} per adult · ${q[0].name}</div></div></div>
    <div class="fb"><details class="more" ${i===0?"open":""}><summary>Compare ${q.length} booking sites</summary><div class="tbl-wrap"><table><thead><tr><th>Site</th><th class="r">Per adult</th><th class="r">Total</th><th class="r">Conv. fee</th><th class="r"></th></tr></thead><tbody>
    ${q.map((p,j)=>provRow(p,fLink(p.id,s),PREFILL_F.has(p.id),`<td class="r mono">${money(p.per)}</td><td class="r mono"><b>${money(p.total)}</b></td><td class="r mono">${p.fee?money(p.fee):"None"}</td>`,j===0)).join("")}</tbody></table></div></details></div></article>`}).join("")}
  <section class="panel"><h3>Shift your dates to save</h3>${dateStrip(J)}</section>
  <section class="panel"><h3>Live tools</h3><div class="links">${[...new Set(segs.map(s=>s.a.iata))].slice(0,4).map(c=>`<a class="btn small" target="_blank" rel="noopener" href="https://www.flightradar24.com/data/airports/${c.toLowerCase()}">Live board ${c} ↗</a>`).join("")}<a class="btn small" target="_blank" rel="noopener" href="https://www.skyscanner.co.in/price-alerts">Skyscanner price alerts ↗</a></div></section>
  ${disclaimer}`}
function journeyAlt(J){const O=ORIGIN(),first=J.stops[0].c,last=J.stops[J.stops.length-1].c;const out=planTravel(O,first,J.dep).filter(s=>s.type==="flight");const back=planTravel(first,O,J.ret).filter(s=>s.type==="flight");

function vFood(J){const ccs=[...new Set(J.stops.map(s=>s.c.cc))];
  return`<div class="sec-head"><div><h2>Food guide</h2><p>What to eat, how easy vegetarian and Indian food is, and what a day of meals costs at each stop.</p></div><div style="display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden">${FOOD_STYLES.map(f=>`<button class="fbtn" data-f="${f.k}" aria-pressed="${S.food===f.k}" style="border:0;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13.5px;background:${S.food===f.k?"var(--ink)":"var(--surface)"};color:${S.food===f.k?"var(--surface)":"var(--muted)"}">${f.n}</button>`).join("")}</div></div>

    <div class="grid3" style="margin-top:14px"><div><div class="eyebrow">Vegetarian</div><p style="margin:4px 0 0">${esc(f[1])}</p></div><div><div class="eyebrow">Indian food</div><p style="margin:4px 0 0">${esc(f[2])}</p></div><div><div class="eyebrow">Typical meal</div><p style="margin:4px 0 0" class="num">Street ${money(f[3][0]*FX.USD)} · Casual ${money(f[3][1]*FX.USD)} · Nice ${money(f[3][2]*FX.USD)}</p></div></div></section>`}).join("")}

function lineChart(series,{w=760,h=260,pad=[20,30,34,60],band=null,mark=null,xl}){
  const all=series.flatMap(s=>s.pts.map(p=>p.y)).concat(band?band.flatMap(b=>[b.lo,b.hi]):[]);let mn=Math.min(...all),mx=Math.max(...all);const span=mx-mn||1;mn-=span*.1;mx+=span*.1;
  const n=Math.max(...series.flatMap(s=>s.pts.map(p=>p.i)))+1;const X=i=>pad[3]+i*(w-pad[1]-pad[3])/Math.max(1,n-1),Y=v=>pad[0]+(1-(v-mn)/(mx-mn))*(h-pad[0]-pad[2]);
  const ticks=[];const step=niceStep((mx-mn)/4);for(let t=Math.ceil(mn/step)*step;t<=mx;t+=step)ticks.push(t);
  let g=ticks.map(t=>`<line x1="${pad[3]}" x2="${w-pad[1]}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pad[3]-8}" y="${Y(t)+4}" text-anchor="end">${shortMoney(t)}</text>`).join("");
  g+=xl.map((l,i)=>l?`<text x="${X(i)}" y="${h-10}" text-anchor="middle">${l}</text>`:"").join("");
  if(band)g+=`<path d="${band.map((b,i)=>`${i?"L":"M"}${X(b.i)},${Y(b.hi)}`).join("")}${band.slice().reverse().map(b=>`L${X(b.i)},${Y(b.lo)}`).join("")}Z" fill="var(--accent)" opacity=".15"/>`;
  for(const s of series){const d=s.pts.map((p,i)=>`${i?"L":"M"}${X(p.i)},${Y(p.y)}`).join("");if(s.area)g+=`<path d="${d}L${X(s.pts[s.pts.length-1].i)},${h-pad[2]}L${X(s.pts[0].i)},${h-pad[2]}Z" fill="${s.col}" opacity=".1"/>`;g+=`<path d="${d}" fill="none" stroke="${s.col}" stroke-width="2.5" ${s.dash?'stroke-dasharray="6 5"':""} stroke-linejoin="round"/>`;const L=s.pts[s.pts.length-1];if(s.end)g+=`<circle cx="${X(L.i)}" cy="${Y(L.y)}" r="4.5" fill="${s.col}"/>`}
  if(mark)g+=`<circle cx="${X(mark.i)}" cy="${Y(mark.y)}" r="6" fill="var(--surface)" stroke="var(--good)" stroke-width="3"/><text x="${X(mark.i)+(mark.i===0?12:0)}" y="${Y(mark.y)-12}" text-anchor="${mark.i===0?"start":"middle"}" style="fill:var(--good);font-weight:600">${mark.label}</text>`;
  return`<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img">${g}</svg></div>`}
function niceStep(x){const p=10**Math.floor(Math.log10(x||1));const f=x/p;return(f<1.5?1:f<3?2:f<7?5:10)*p}
function pairTrend(o,d,mStart,count){const out=[];for(let i=0;i<count;i++){const m=new Date(TODAY.getFullYear(),TODAY.getMonth()+mStart+i,15);let s=0,c=0;for(const day of [5,12,19,26]){const dt=new Date(m.getFullYear(),m.getMonth(),day);if(dt>TODAY&&diffD(TODAY,dt)<21)continue;const b=dt<=TODAY?addD(dt,-45):(addD(dt,-45)<TODAY?TODAY:addD(dt,-45));s+=(fare(o,d,dt,b)+fare(d,o,addD(dt,7),b))*S.adults;c++}if(!c){const dt=addD(TODAY,21);s=(fare(o,d,dt)+fare(d,o,addD(dt,7)))*S.adults;c=1}out.push({m,p:s/c})}return out}
function vTrends(J){const mp=mainPair(J);if(!mp)return`<div class="sec-head"><div><h2>Fare trends</h2><p>This trip has no flights; transfers are by road, rail or sea.</p></div></div>`;
  const [o,d]=mp;const past=pairTrend(o,d,-12,12),ahead=pairTrend(o,d,0,9);const v=verdict(J);
  const all=past.concat(ahead);const xl=all.map((p,i)=>i%2?"":MON[p.m.getMonth()]+" "+String(p.m.getFullYear()).slice(2));
  const pastPts=past.map((p,i)=>({i,y:p.p})).concat([{i:past.length,y:ahead[0].p}]);const aheadPts=ahead.map((p,i)=>({i:i+past.length,y:p.p}));
  const band=ahead.map((p,i)=>({i:i+past.length,lo:p.p*(1-.04-i*.012),hi:p.p*(1+.04+i*.012)}));
  const yoy=past[0].p,last=past[past.length-1].p,cheapM=ahead.slice(1).reduce((a,b)=>b.p<a.p?b:a,ahead[1]);
  const curve=bookingCurve(J);const cPts=curve.map(c=>({i:c.k,y:c.p}));const mi=cPts.length?cPts.reduce((a,b)=>b.y<a.y?b:a,cPts[0]):null;
  return`<div class="sec-head"><div><h2>Fare trends</h2><p>Main route ${o.iata}–${d.iata} (${esc(o.city)} to ${esc(d.city)}) round-trip average for ${S.adults}, plus when to buy all ${allSegs(J).filter(s=>s.type==="flight").length} flights on your trip.</p></div></div>
  <div class="grid3">
    <div class="panel"><div class="eyebrow">Past 12 months</div><h3 style="margin:6px 0 0" class="num">${last>yoy?"+":""}${Math.round((last/yoy-1)*100)}% vs a year ago</h3><span class="note">Last month averaged ${money(last)}</span></div>
    <div class="panel"><div class="eyebrow">Cheapest month ahead</div><h3 style="margin:6px 0 0">${MON[cheapM.m.getMonth()]} ${cheapM.m.getFullYear()}</h3><span class="note">Around ${money(cheapM.p)}</span></div>

  <section class="panel"><h3>${o.iata}–${d.iata} monthly average: last 12 months and next 8</h3>${lineChart([{pts:pastPts,col:"var(--teal)",area:true},{pts:aheadPts,col:"var(--accent)",dash:true,end:true}],{band,xl})}
    <div class="row note"><span><b style="color:var(--teal)">━</b> Past average (booked ~45 days ahead)</span><span><b style="color:var(--accent)">╍</b> Expected, with likely range</span></div></section>
  <section class="panel"><h3>When to buy all flights for ${fmtDY(J.dep)}</h3><p class="note" style="margin-top:0">Expected total if you book this week, next week and so on.</p>${cPts.length>1?lineChart([{pts:cPts,col:"var(--ink)",area:true,end:true}],{h:220,xl:curve.map(c=>c.k===0?"Now":"+"+c.k+"w"),mark:{...mi,label:"Lowest"}}):`<p>Departure is less than a week away. Book now.</p>`}</section>${disclaimer}`}

/* Itinerary */
function planKey(){return`plan:${S.from}:${S.trip}:${S.dep}:${S.stops.map(s=>s.id+s.n).join("-")}`}
function genPlan(J){const days=[];const ptr={};const nx=c=>{ptr[c.id]=ptr[c.id]||0;return c.sights[ptr[c.id]++%c.sights.length]};
  J.stops.forEach((st,i)=>{for(let j=0;j<st.n;j++){const items=[];const c=st.c;
    if(j===0){const leg=J.legs[i];const how=leg.segs.map(segLabel).join(" + ");items.push({t:i===0?"Arrive":"Transfer",x:i===0?`Travel ${sname(leg.from)} → ${sname(c)} (${how})`:`${sname(leg.from)} → ${sname(c)}: ${how}, about ${fmtHrs(leg.segs.reduce((a,s)=>a+s.hours,0))}`});items.push({t:"Check in",x:`Hotel in ${c.areas[0]}`});items.push({t:"Evening",x:nx(c)})}
    else{items.push({t:"Morning",x:nx(c)});items.push({t:"Afternoon",x:nx(c)});items.push({t:"Evening",x:j===1?`Dinner: ${c.eat}`:nx(c)})}
    days.push({city:c.id,items})}});
  const lastLeg=J.legs[J.legs.length-1];const lc=J.stops[J.stops.length-1].c;
  days.push({city:lc.id,items:S.trip==="round"?[{t:"Morning",x:"Check out, last-minute shopping"},{t:"Depart",x:`${sname(lc)} → ${sname(ORIGIN())}: ${lastLeg.segs.map(segLabel).join(" + ")}`}]:[{t:"Morning",x:"Check out"},{t:"Onward",x:`Trip ends in ${sname(lc)}`}]});return days}
function getPlan(J){const p=store.get(planKey(),null);return p&&p.length===J.nights+1?p:genPlan(J)}
function vPlan(J){const plan=getPlan(J);
  return`<div class="sec-head"><div><h2>Itinerary</h2><p>Day by day across ${J.stops.map(s=>esc(sname(s.c))).join(", ")}, with transfer days built in. Edit, reorder or add your own; it saves in this browser.</p></div><div class="row"><button class="btn" id="regen">Reset plan</button><a class="btn primary" href="#share">Share plan</a></div></div>
  <div class="days" id="days">${plan.map((d,i)=>{const dt=addD(J.dep,i);const c=CITY[d.city];const hs=holidaysNear(c.cc,dt,0,0);return`<article class="dcard"><header><div><b>Day ${i+1}</b> <span class="note">${DOW[dt.getDay()]}, ${fmtDY(dt)} · ${esc(sname(c))}</span></div>${hs.length?`<span class="hol-flag">Holiday: ${esc(hs[0][1])}. Some sights may close.</span>`:""}</header>
    <ol>${d.items.map((it,j)=>`<li><span class="t">${esc(it.t)}</span><span>${esc(it.x)}</span><span class="acts"><button class="icon-btn" data-a="up" data-d="${i}" data-j="${j}" aria-label="Move up">↑</button><button class="icon-btn" data-a="down" data-d="${i}" data-j="${j}" aria-label="Move down">↓</button><button class="icon-btn" data-a="del" data-d="${i}" data-j="${j}" aria-label="Remove">✕</button></span></li>`).join("")}</ol>
    <form class="add-row" data-d="${i}"><select id="slot${i}" aria-label="Time">${["Morning","Afternoon","Evening","Night"].map(s=>`<option>${s}</option>`).join("")}</select><input id="add${i}" placeholder="Add an activity" aria-label="Activity for day ${i+1}"><button class="btn small" type="submit">Add</button></form></article>`}).join("")}</div>`}
after.plan=J=>{const save2=p=>{store.set(planKey(),p);render()};
  $("#days").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const p=getPlan(J);const L=p[+b.dataset.d].items,j=+b.dataset.j;
    if(b.dataset.a==="del")L.splice(j,1);else if(b.dataset.a==="up"&&j>0)[L[j-1],L[j]]=[L[j],L[j-1]];else if(b.dataset.a==="down"&&j<L.length-1)[L[j+1],L[j]]=[L[j],L[j+1]];save2(p)});

/* Holidays */
function holSel(J){const base=S.holSel&&S.holSel.length?S.holSel:[...new Set([ORIGIN().cc,...J.stops.map(s=>s.c.cc),"US","GB"])];return base.filter(c=>HOL[c]).slice(0,8)}
function longWeekends(cc){const we=WEEKEND[cc]||[0,6];const set=new Set((HOL[cc]||[]).map(h=>h[0]));const isOff=d=>we.includes(d.getDay())||set.has(iso(d));const out=[];const seen=new Set();
  for(const [ds,name] of HOL[cc]||[]){const d=parse(ds);if(d<TODAY||we.includes(d.getDay()))continue;let best=null;
    for(let lb=0;lb<=2;lb++)for(let la=0;la<=2-lb;la++){let s=addD(d,-lb),e=addD(d,la);while(isOff(addD(s,-1)))s=addD(s,-1);while(isOff(addD(e,1)))e=addD(e,1);let leave=0;for(let x=new Date(s);x<=e;x=addD(x,1))if(!isOff(x))leave++;const len=diffD(s,e)+1;if(len>=3&&(!best||len-leave*1.5>best.len-best.leave*1.5))best={s,e,len,leave,name}}
    if(best){const k=iso(best.s);if(!seen.has(k)){seen.add(k);out.push(best)}}}return out.slice(0,10)}
function vHolidays(J){const sel=holSel(J);const months=[];for(let i=0;i<14;i++){const m=new Date(TODAY.getFullYear(),TODAY.getMonth()+i,1);if(m.getFullYear()>2027)break;months.push(m)}

  const home=ORIGIN().cc;const lws=longWeekends(home);const first=new Date(mm.getFullYear(),mm.getMonth(),1),dim=new Date(mm.getFullYear(),mm.getMonth()+1,0).getDate();const dep=S.dep,ret=iso(J.ret);

    cells+=`<div class="c ${ds>=dep&&ds<=ret?"trip":""} ${dt.getDay()%6===0?"we":""}" title="${esc(hs.map(x=>`${ccName(x.c)}: ${x.h[1]}`).join("\n"))}"><span class="dn">${day}</span><span class="hs">${hs.map(x=>`<s style="background:${HOL_COLORS[x.ci]}"></s>`).join("")}</span>${hs.slice(0,2).map(x=>`<span class="hn">${esc(x.h[1])}</span>`).join("")}</div>`}
  const list=sel.flatMap((c,ci)=>(HOL[c]||[]).filter(h=>h[0].startsWith(curM.slice(0,7))).map(h=>({c,ci,h}))).sort((a,b)=>a.h[0].localeCompare(b.h[0]));
  return`<div class="sec-head"><div><h2>World holiday calendar</h2><p>Public holidays for ${Object.keys(HOL).length} countries through Dec 2027. Dodge crowds abroad and stretch your leave at home. An asterisk marks dates that depend on the moon sighting.</p></div></div>
  <section class="panel"><div class="row" style="justify-content:space-between"><div class="chips" id="holChips">${sel.map((c,i)=>`<button class="chip" aria-pressed="true" data-c="${c}"><s style="background:${HOL_COLORS[i]}"></s>${esc(ccName(c))} ✕</button>`).join("")}</div>
    <div class="row"><select id="holAdd" class="btn small" aria-label="Add country"><option value="">+ Add country</option>${all.filter(c=>!sel.includes(c)).map(c=>`<option value="${c}">${esc(ccName(c))}</option>`).join("")}</select><select id="holMonth" class="btn small" aria-label="Month">${months.map(m=>`<option value="${iso(m)}" ${iso(m)===curM?"selected":""}>${MON[m.getMonth()]} ${m.getFullYear()}</option>`).join("")}</select></div></div>
    <div class="cal" style="margin-top:14px">${cells}</div><p class="note">Shaded days are your trip.</p>
    <div>${list.length?list.map(x=>`<div class="lw" style="grid-template-columns:auto 1fr auto"><span class="d">${DOW[parse(x.h[0]).getDay()]}<b>${parse(x.h[0]).getDate()}</b></span><span><b>${esc(x.h[1])}</b></span><span class="pill"><s style="width:8px;height:8px;border-radius:50%;background:${HOL_COLORS[x.ci]};display:inline-block"></s>${esc(ccName(x.c))}</span></div>`).join(""):`<p class="note">No public holidays this month in the selected countries.</p>`}</div></section>
  <section class="panel"><h3>Long weekends in ${esc(ccName(home))}</h3><p class="note" style="margin-top:0">Holidays next to a weekend, with the fewest leave days for the longest break. "Plan" starts your trip that day.</p>
    ${lws.length?lws.map(l=>`<div class="lw"><span class="d">${MON[l.s.getMonth()]}<b>${l.s.getDate()}</b></span><div><b>${l.len} days off</b> · ${l.leave?`take ${l.leave} day${l.leave>1?"s":""} of leave`:"no leave needed"}<div class="note">${esc(l.name)} · ${DOW[l.s.getDay()]} ${fmtD(l.s)} – ${DOW[l.e.getDay()]} ${fmtD(l.e)}</div></div><button class="btn small" data-s="${iso(l.s)}" data-len="${l.len}">Plan</button></div>`).join(""):`<p class="note">No upcoming long weekends found.</p>`}</section>`}

function shareText(){const J=journey();const c=costs(J);const v=verdict(J);const plan=getPlan(J);const O=ORIGIN();
  const lines=[`✈️ ${O.city} → ${J.stops.map(s=>`${sname(s.c)} (${s.n}n)`).join(" → ")}${S.trip==="round"?` → ${O.city}`:""}`,`📅 ${fmtD(J.dep)} – ${fmtDY(J.ret)} · ${J.nights} nights · ${S.adults} traveller${S.adults>1?"s":""}`,``,`Getting around:`];
  J.legs.forEach(l=>lines.push(`• ${fmtD(l.date)} ${sname(l.from)} → ${sname(l.to)}: ${l.segs.map(segLabel).join(" + ")}`));
  lines.push(``,`Hotels: ${J.stops.map(st=>`${sname(st.c)} ~${money(hotelBest(st).night)}/night`).join(", ")}`);
  destCountries(J).forEach(cc=>{const vi=visaOf(cc);lines.push(`Visa ${ccName(cc)}: ${vi[0]}${vi[1]?` ~${money(vi[1])} pp`:""}`)});
  lines.push(`Estimated total: ${money(c.total)} (${money(c.total/S.adults)} pp)`,`Trip score: ${v.score}/100 · ${v.head}`,``,`Day plan:`);
  plan.forEach((d,i)=>lines.push(`Day ${i+1} ${fmtD(addD(J.dep,i))} · ${sname(CITY[d.city])}: ${d.items.map(x=>x.x).join(" · ")}`));
  lines.push(``,`Planned on Loop Commute`,`#travel #${sname(J.stops[0].c).replace(/[^A-Za-z]/g,"")} #loopcommute`);return lines.join("\n")}
function vShare(J){const t=shareText();const enc=encodeURIComponent(t);
  return`<div class="sec-head"><div><h2>Share the plan</h2><p>Send the route, costs and day plan to friends and family, or post a story card.</p></div></div>
  <div class="share-grid"><section class="panel"><h3>Send</h3><div class="share-btns">
    <a class="sbtn" href="https://wa.me/?text=${enc}" target="_blank" rel="noopener"><span class="mk" style="background:#25D366">WA</span>WhatsApp</a>
    <a class="sbtn" href="https://t.me/share/url?url=${encodeURIComponent("https://www.skyscanner.co.in")}&text=${enc}" target="_blank" rel="noopener"><span class="mk" style="background:#229ED9">TG</span>Telegram</a>
    <a class="sbtn" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(t.split("\n").slice(0,3).join("\n").slice(0,250))}" target="_blank" rel="noopener"><span class="mk" style="background:#111">X</span>X (Twitter)</a>
    <a class="sbtn" href="https://www.linkedin.com/feed/?shareActive=true&text=${enc}" target="_blank" rel="noopener"><span class="mk" style="background:#0A66C2">in</span>LinkedIn</a>
    <button class="sbtn" id="copyBtn" type="button"><span class="mk" style="background:var(--ink);color:var(--surface)">⧉</span>Copy text</button></div>
    <label class="eyebrow" for="shareTxt" style="display:block;margin-top:16px">Message</label><textarea class="share" id="shareTxt" readonly>${esc(t)}</textarea><p class="note">For email or SMS, copy the text and paste it into your app.</p></section>
  <section class="panel"><h3>Instagram story card</h3><p class="note" style="margin-top:0">Instagram has no web share link. Save the card, then post it from the Instagram app with the caption below.</p>
    <img class="story" id="story" alt="Story card for this trip"><div class="row" style="margin-top:12px"><button class="btn primary" id="saveStory" hidden>Save image</button><button class="btn" id="copyCap">Copy caption</button><a class="btn" href="https://www.instagram.com/" target="_blank" rel="noopener">Open Instagram ↗</a></div>
    <p class="note">On a phone, press and hold the card to save it.</p></section></div>`}
let DL=null,dlTried=false;
after.share=async J=>{const ta=$("#shareTxt");$("#copyBtn").addEventListener("click",()=>copy(ta.value,ta));
  const cap=`${J.stops.map(s=>sname(s.c)).join(" → ")} · ${fmtD(J.dep)}–${fmtD(J.ret)} ✈️ ${J.nights} nights, est. ${money(costs(J).total/S.adults)} per person. #travel #loopcommute`;
  $("#copyCap").addEventListener("click",()=>copy(cap));const url=storyCard(J);$("#story").src=url;
  if(!dlTried){dlTried=true;try{DL=window.claude?await window.claude.use("downloads"):null}catch(e){DL=null}}
  const btn=$("#saveStory");if(DL&&btn){btn.hidden=false;btn.addEventListener("click",async()=>{try{const blob=await (await fetch(url)).blob();await DL.save({filename:`loop-commute-${S.stops.map(s=>s.id).join("-")}.png`,data:blob});toast("Saved")}catch(e){if(e&&e.code==="declined")return;toast("Couldn't save here. Press and hold the card instead.")}})}};
function storyCard(J){const W=1080,H=1920,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");const c=costs(J);const v=verdict(J);const O=ORIGIN();
  g.fillStyle="#13202E";g.fillRect(0,0,W,H);g.strokeStyle="#22344A";g.lineWidth=2;for(let y=0;y<H;y+=80){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.fillStyle="#D9822B";g.fillRect(0,0,W,16);g.fillStyle="#9DB0C4";g.font="600 34px 'JetBrains Mono',monospace";g.fillText("LOOP COMMUTE · TRIP PLAN",80,130);
  const codes=[O.id,...J.stops.map(s=>s.c.id)].concat(S.trip==="round"?[O.id]:[]);const rows=Math.ceil(codes.length/2);
  codes.forEach((code,i)=>{const col=i%2,row=Math.floor(i/2);const x=80+col*470,y=190+row*150;g.fillStyle="#1C2D40";roundRect(g,x,y,330,120,14);g.fill();g.fillStyle="#F3E6CC";g.font="600 84px 'JetBrains Mono',monospace";g.fillText(code,x+32,y+90);g.fillStyle="#D9822B";g.font="700 40px sans-serif";if(i<codes.length-1)g.fillText(col===0?"→":"↙",x+352,y+76)});
  let y=190+rows*150+60;g.fillStyle="#F3E6CC";g.font="800 64px 'Big Shoulders Display',sans-serif";const title=J.stops.map(s=>sname(s.c).toUpperCase()).join(" · ");wrapText(g,title,80,y,W-160,70);y+=Math.ceil(g.measureText(title).width/(W-160))*70+10;
  g.fillStyle="#9DB0C4";g.font="500 38px Figtree,sans-serif";g.fillText(`${fmtD(J.dep)} – ${fmtDY(J.ret)} · ${J.nights} nights · ${S.adults} pax`,80,y);y+=90;
  const items=[["FLIGHTS",money(c.items[0].v)],["TRANSFERS",money(c.items[1].v)],["HOTELS",money(c.items[2].v)],["FOOD",money(c.items[3].v)],["EST. TOTAL",money(c.total)]];
  items.forEach((r,i)=>{const yy=y+i*105;g.strokeStyle="#2B3E54";g.setLineDash([10,10]);g.beginPath();g.moveTo(80,yy+36);g.lineTo(W-80,yy+36);g.stroke();g.setLineDash([]);g.fillStyle="#9DB0C4";g.font="600 30px 'JetBrains Mono',monospace";g.fillText(r[0],80,yy);g.fillStyle=i===4?"#D9822B":"#F3E6CC";g.font="700 46px 'JetBrains Mono',monospace";g.textAlign="right";g.fillText(r[1],W-80,yy+6);g.textAlign="left"});
  g.fillStyle="#D9822B";roundRect(g,80,1720,W-160,110,55);g.fill();g.fillStyle="#1B1206";g.font="800 52px 'Big Shoulders Display',sans-serif";g.textAlign="center";g.fillText(`${v.head.toUpperCase()} · ${v.score}/100`,W/2,1793);g.textAlign="left";return cv.toDataURL("image/png")}
function wrapText(g,t,x,y,w,lh){const words=t.split(" ");let line="";for(const wd of words){const test=line?line+" "+wd:wd;if(g.measureText(test).width>w&&line){g.fillText(line,x,y);line=wd;y+=lh}else line=test}g.fillText(line,x,y)}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

initForm();render();window.addEventListener("hashchange",()=>{render();window.scrollTo({top:0})});

</script>
